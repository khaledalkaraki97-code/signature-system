<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة المقارنة والمطابقة الجنائية للتواقيع</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2, h3 { text-align: center; color: #1a365d; }
        .upload-section {
            display: flex;
            gap: 20px;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .upload-box {
            flex: 1;
            border: 2px dashed #cbd5e0;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            background: #f8fafc;
        }
        input[type="file"] { margin-top: 10px; }
        button {
            width: 100%;
            padding: 14px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover { background-color: #2c5282; }
        .result-area { margin-top: 30px; text-align: center; }
        canvas { display: none; }
        .output-img {
            max-width: 100%;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-top: 15px;
        }
        .slider-control {
            margin: 20px auto;
            padding: 15px;
            background: #edf2f7;
            border-radius: 8px;
            max-width: 600px;
        }
        .slider-control label {
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }
        .slider-control input[type="range"] {
            width: 80%;
            cursor: pointer;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-weight: bold;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .color-box { width: 16px; height: 16px; border-radius: 3px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔬 منظومة التحليل والمطابقة الجنائية للتواقيع</h2>
    
    <div class="upload-section">
        <div class="upload-box">
            <label><b>رفع التوقيع الأصلي (المرجعي):</b></label><br>
            <input type="file" id="origInput" accept="image/*">
        </div>
        <div class="upload-box">
            <label><b>رفع التوقيع المشتبه به:</b></label><br>
            <input type="file" id="suspInput" accept="image/*">
        </div>
    </div>

    <button onclick="processSignatures()">🚀 تحليل وفصل ورسم التطابق المتداخل</button>

    <div class="result-area" id="resultArea" style="display:none;">
        <h3>🔵🔴 خريطة التراكب والمطابقة البصرية (Overlay)</h3>
        
        <div class="slider-control">
            <label for="opacitySlider">🎛️ نسبة شفافية التوقيع المشتبه به (الأحمر): <span id="opacityVal">70%</span></label>
            <input type="range" id="opacitySlider" min="0" max="100" value="70" oninput="updateOverlayOpacity()">
        </div>

        <div class="legend">
            <div class="legend-item"><div class="color-box" style="background:#0055ff;"></div> التوقيع الأصلي</div>
            <div class="legend-item"><div class="color-box" style="background:#ff0044;"></div> التوقيع المشتبه به</div>
            <div class="legend-item"><div class="color-box" style="background:#8000aa;"></div> مناطق التطابق المباشر</div>
        </div>
        
        <img id="overlayOutput" class="output-img" alt="خريطة التراكب">

        <h3 style="margin-top: 40px;">📋 جدول المقارنة التفصيلي</h3>
        <img id="gridOutput" class="output-img" alt="جدول المقارنة الجنائي">
    </div>
</div>

<canvas id="workCanvas"></canvas>
<canvas id="mainCanvas"></canvas>

<script>
let globalImg1 = null;
let globalImg2 = null;

function processSignatures() {
    const origInput = document.getElementById('origInput').files[0];
    const suspInput = document.getElementById('suspInput').files[0];

    if (!origInput || !suspInput) {
        alert("يرجى رفع الصورتين أولاً!");
        return;
    }

    globalImg1 = new Image();
    globalImg2 = new Image();

    globalImg1.src = URL.createObjectURL(origInput);
    globalImg2.src = URL.createObjectURL(suspInput);

    let loaded = 0;
    const onLoad = () => {
        loaded++;
        if (loaded === 2) {
            generateOverlay();
            renderGrid(globalImg1, globalImg2);
            document.getElementById('resultArea').style.display = 'block';
        }
    };

    globalImg1.onload = onLoad;
    globalImg2.onload = onLoad;
}

function updateOverlayOpacity() {
    const val = document.getElementById('opacitySlider').value;
    document.getElementById('opacityVal').innerText = val + '%';
    if (globalImg1 && globalImg2) {
        generateOverlay();
    }
}

// دالة عزل الحبر عن خلفية الورقة المتدرجة
function getInkMask(ctx, img, w, h) {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    // 1. حساب متوسط السطوع لكامل الصورة لتحديد عتبة متكيفة
    let totalLum = 0;
    for (let i = 0; i < data.length; i += 4) {
        totalLum += (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114);
    }
    const avgLum = totalLum / (w * h);
    
    // العتبة الذكية: البكسل يعتبر حبر إذا كان أغمق بشكل ملحوظ من متوسط الورقة
    const threshold = avgLum * 0.72; 

    const mask = new Uint8Array(w * h);
    for (let i = 0, j = 0; i < data.length; i += 4, j++) {
        const lum = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
        mask[j] = lum < threshold ? 1 : 0;
    }
    return mask;
}

function generateOverlay() {
    const canvas = document.getElementById('workCanvas');
    const ctx = canvas.getContext('2d');
    const w = 700;
    const h = 400;

    canvas.width = w;
    canvas.height = h;

    const opacityFactor = parseFloat(document.getElementById('opacitySlider').value) / 100;

    // استخراج مصفوفة الحبر العازلة للصورة الأولى والثانية
    const mask1 = getInkMask(ctx, globalImg1, w, h);
    const mask2 = getInkMask(ctx, globalImg2, w, h);

    const overlayData = ctx.createImageData(w, h);

    for (let i = 0; i < mask1.length; i++) {
        const idx = i * 4;
        const isInk1 = mask1[i] === 1;
        const isInk2 = mask2[i] === 1;

        if (isInk1 && isInk2) {
            // منطقة التطابق (بنفسجي/أرجواني)
            overlayData.data[idx] = Math.round(130 * opacityFactor);       // R
            overlayData.data[idx+1] = 0;                                  // G
            overlayData.data[idx+2] = 220;                                // B
            overlayData.data[idx+3] = 255;
        } else if (isInk1) {
            // التوقيع الأصلي (أزرق صريح)
            overlayData.data[idx] = 0;
            overlayData.data[idx+1] = 80;
            overlayData.data[idx+2] = 255;
            overlayData.data[idx+3] = 255;
        } else if (isInk2) {
            // التوقيع المشتبه به (أحمر مع التحكم بالشفافية)
            overlayData.data[idx] = 255;
            overlayData.data[idx+1] = 0;
            overlayData.data[idx+2] = 50;
            overlayData.data[idx+3] = Math.round(255 * opacityFactor);
        } else {
            // خلفية بيضاء نقية 100%
            overlayData.data[idx] = 255;
            overlayData.data[idx+1] = 255;
            overlayData.data[idx+2] = 255;
            overlayData.data[idx+3] = 255;
        }
    }

    ctx.putImageData(overlayData, 0, 0);
    document.getElementById('overlayOutput').src = canvas.toDataURL('image/png');
}

function renderGrid(img1, img2) {
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    const cellW = 500;
    const cellH = 250;
    const gap = 6;

    canvas.width = (cellW * 2) + gap;
    canvas.height = (cellH * 4) + (gap * 3);

    ctx.fillStyle = "#cbd5e0";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    function createPairCanvas(drawHighlights) {
        const c = document.createElement('canvas');
        c.width = cellW * 2 + gap;
        c.height = cellH;
        const cx = c.getContext('2d');

        cx.fillStyle = "#ffffff";
        cx.fillRect(0, 0, c.width, c.height);

        cx.drawImage(img1, 0, 0, cellW, cellH);
        cx.drawImage(img2, cellW + gap, 0, cellW, cellH);

        drawHighlights(cx, cellW, cellH, gap);
        return c;
    }

    const row1 = createPairCanvas((cx, w, h, g) => {
        cx.strokeStyle = "#e53e3e";
        cx.lineWidth = 3;
        
        cx.beginPath();
        cx.arc(w * 0.61, h * 0.16, 22, 0, 2 * Math.PI);
        cx.stroke();

        cx.beginPath();
        cx.arc(w + g + (w * 0.88), h * 0.16, 22, 0, 2 * Math.PI);
        cx.stroke();
    });

    const row2 = createPairCanvas((cx, w, h, g) => {
        cx.strokeStyle = "#e53e3e";
        cx.lineWidth = 3;
        cx.strokeRect(w * 0.35, h * 0.42, w * 0.18, h * 0.38);
        cx.strokeRect(w + g + (w * 0.12), h * 0.42, w * 0.18, h * 0.38);
    });

    const row3 = createPairCanvas((cx, w, h, g) => {
        cx.strokeStyle = "#e53e3e";
        cx.lineWidth = 3;

        const cropX = w * 0.35;
        const cropY = h * 0.42;
        const cropW = w * 0.18;
        const cropH = h * 0.38;
        cx.strokeRect(cropX, cropY, cropW, cropH);

        const zoomW = cropW * 1.8;
        const zoomH = cropH * 1.8;
        const zoomX = w * 0.58;
        const zoomY = h * 0.22;

        const scaleX = img1.naturalWidth / cellW;
        const scaleY = img1.naturalHeight / cellH;

        cx.fillStyle = "#ffffff";
        cx.fillRect(zoomX, zoomY, zoomW, zoomH);
        cx.drawImage(
            img1, 
            cropX * scaleX, cropY * scaleY, cropW * scaleX, cropH * scaleY, 
            zoomX, zoomY, zoomW, zoomH
        );
        cx.strokeRect(zoomX, zoomY, zoomW, zoomH);

        cx.strokeRect(w + g + (w * 0.12), h * 0.42, w * 0.18, h * 0.38);
    });

    const row4 = createPairCanvas((cx, w, h, g) => {
        cx.strokeStyle = "#e53e3e";
        cx.lineWidth = 3;

        cx.beginPath();
        cx.ellipse(w * 0.43, h * 0.88, w * 0.40, h * 0.08, -0.08, 0, 2 * Math.PI);
        cx.stroke();

        cx.beginPath();
        cx.ellipse(w + g + (w * 0.48), h * 0.70, w * 0.36, h * 0.12, -0.05, 0, 2 * Math.PI);
        cx.stroke();
    });

    const rows = [row1, row2, row3, row4];
    rows.forEach((r, idx) => {
        ctx.drawImage(r, 0, idx * (cellH + gap));
    });

    document.getElementById('gridOutput').src = canvas.toDataURL('image/png');
}
</script>

</body>
</html>
