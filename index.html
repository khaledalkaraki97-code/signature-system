<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة المقارنة التفصيلية للتواقيع الجنائية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #1a365d; margin-bottom: 25px; }
        .upload-section {
            display: flex;
            gap: 20px;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .upload-box {
            flex: 1;
            border: 2px dashed #cbd5e0;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            background: #f8fafc;
        }
        input[type="file"] { margin-top: 10px; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #2c5282; }
        .result-area { margin-top: 30px; text-align: center; }
        canvas { display: none; }
        #outputImage {
            max-width: 100%;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔬 منظومة المقارنة التفصيلية الجنائية للتواقيع</h2>
    
    <div class="upload-section">
        <div class="upload-box">
            <label><b>رفع التوقيع الأصلي المرجعي:</b></label><br>
            <input type="file" id="origInput" accept="image/*">
        </div>
        <div class="upload-box">
            <label><b>رفع التوقيع المشتبه به:</b></label><br>
            <input type="file" id="suspInput" accept="image/*">
        </div>
    </div>

    <button onclick="generateComparisonTable()">🚀 إنشاء جدول المقارنة التفصيلي</button>

    <div class="result-area" id="resultArea" style="display:none;">
        <h3>📋 النتيجة النهائية (جدول التحليل الجنائي):</h3>
        <img id="outputImage" alt="جدول المقارنة الجنائي">
    </div>
</div>

<canvas id="mainCanvas"></canvas>

<script>
function generateComparisonTable() {
    const origInput = document.getElementById('origInput').files[0];
    const suspInput = document.getElementById('suspInput').files[0];

    if (!origInput || !suspInput) {
        alert("يرجى رفع الصورتين أولاً!");
        return;
    }

    const img1 = new Image();
    const img2 = new Image();

    img1.src = URL.createObjectURL(origInput);
    img2.src = URL.createObjectURL(suspInput);

    let loadedCount = 0;
    const onImgLoad = () => {
        loadedCount++;
        if (loadedCount === 2) {
            renderGrid(img1, img2);
        }
    };

    img1.onload = onImgLoad;
    img2.onload = onImgLoad;
}

function renderGrid(img1, img2) {
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    const cellW = 500;
    const cellH = 200;
    const gap = 8;

    canvas.width = (cellW * 2) + gap;
    canvas.height = (cellH * 4) + (gap * 3);

    ctx.fillStyle = "#cbd5e0";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    function createPairCanvas(drawHighlights) {
        const c = document.createElement('canvas');
        c.width = cellW * 2 + gap;
        c.height = cellH;
        const cx = c.getContext('2d');

        cx.fillStyle = "#ffffff";
        cx.fillRect(0, 0, c.width, c.height);

        cx.drawImage(img1, 0, 0, cellW, cellH);
        cx.drawImage(img2, cellW + gap, 0, cellW, cellH);

        drawHighlights(cx, cellW, cellH, gap);
        return c;
    }

    // 1. الصف الأول: دوائر حمراء على الأجزاء المحددة
    const row1 = createPairCanvas((cx, w, h, g) => {
        cx.strokeStyle = "red";
        cx.lineWidth = 3;
        
        cx.beginPath();
        cx.arc(w * 0.65, h * 0.25, 30, 0, 2 * Math.PI);
        cx.stroke();

        cx.beginPath();
        cx.arc(w + g + (w * 0.85), h * 0.25, 30, 0, 2 * Math.PI);
        cx.stroke();
    });

    // 2. الصف الثاني: مربعات حمراء
    const row2 = createPairCanvas((cx, w, h, g) => {
        cx.strokeStyle = "red";
        cx.lineWidth = 3;
        cx.strokeRect(w * 0.38, h * 0.45, w * 0.18, h * 0.4);
        cx.strokeRect(w + g + (w * 0.12), h * 0.42, w * 0.18, h * 0.4);
    });

    // 3. الصف الثالث: اقتصاص وتكبير المقطع مع سهم
    const row3 = createPairCanvas((cx, w, h, g) => {
        cx.strokeStyle = "red";
        cx.lineWidth = 3;

        // إطار المقطع
        cx.strokeRect(w * 0.38, h * 0.45, w * 0.18, h * 0.4);
        cx.strokeRect(w + g + (w * 0.12), h * 0.42, w * 0.18, h * 0.4);

        // اقتصاص وتكبير
        cx.drawImage(img1, w * 0.38, h * 0.45, w * 0.18, h * 0.4, w * 0.62, h * 0.2, 120, 80);
        cx.strokeRect(w * 0.62, h * 0.2, 120, 80);

        // رسم سهم توضيحي بسيط
        cx.beginPath();
        cx.moveTo(w * 0.52, h * 0.45);
        cx.lineTo(w * 0.62, h * 0.35);
        cx.stroke();
    });

    // 4. الصف الرابع: شكل بيضاوي أحمر
    const row4 = createPairCanvas((cx, w, h, g) => {
        cx.strokeStyle = "red";
        cx.lineWidth = 3;

        cx.beginPath();
        cx.ellipse(w * 0.5, h * 0.75, w * 0.4, h * 0.15, 0, 0, 2 * Math.PI);
        cx.stroke();

        cx.beginPath();
        cx.ellipse(w + g + (w * 0.6), h * 0.68, w * 0.3, h * 0.15, -0.2, 0, 2 * Math.PI);
        cx.stroke();
    });

    // دمج الصفوف الأربعة في الكانفاس الرئيسي
    const rows = [row1, row2, row3, row4];
    rows.forEach((r, idx) => {
        ctx.drawImage(r, 0, idx * (cellH + gap));
    });

    // عرض الصورة النهائية
    const resultImg = document.getElementById('outputImage');
    resultImg.src = canvas.toDataURL('image/png');
    document.getElementById('resultArea').style.display = 'block';
}
</script>

</body>
</html>
